  <style>
    :root {
      --primary: #c73a6a;
      --primary-light: #ff6b9d;
      --secondary: #ffd1dc;
      --tertiary: #ff9a3c;
      --bg: #fff5f8;
      --surface: #ffffff;
      --text: #3d2c33;
      --muted: #8a6e78;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    .wrap { max-width: 480px; margin: 0 auto; }
    section { padding: 24px 20px 36px; position: relative; }

    .topnav {
      position: sticky; top: 0; z-index: 30;
      background: rgba(255,245,248,0.92); backdrop-filter: blur(8px);
      display: flex; gap: 6px; padding: 10px 12px; justify-content: center;
      border-bottom: 1px solid rgba(255,209,220,0.6);
    }
    .topnav a {
      flex: 1; max-width: 110px; text-align: center; padding: 9px 4px; border-radius: var(--radius-full);
      font-size: 13.5px; font-weight: 700; text-decoration: none; color: var(--muted);
      background: var(--surface); border: 1px solid var(--secondary); transition: all .15s ease;
    }
    .topnav a.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .back-hero { text-align: center; padding: 26px 24px 6px; }
    .back-hero .emoji { font-size: 52px; }
    h1 { font-size: 26px; font-weight: 800; margin-top: 6px; }
    .section-sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; text-align: center; }

    .qr-grid { display: flex; flex-direction: column; gap: 18px; }
    .qr-card {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 22px 20px; box-shadow: 0 8px 24px rgba(199,58,106,0.08);
      border: 1px solid rgba(255,209,220,0.5);
      text-align: center;
    }
    .qr-card-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .qr-step {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--primary); color: #fff;
      font-size: 14px; font-weight: 800; line-height: 28px;
    }
    .qr-title { font-size: 18px; font-weight: 800; }
    .qr-desc { color: var(--muted); font-size: 13px; margin-top: 4px; margin-bottom: 16px; }
    .qr-frame {
      background: #fff; border: 1.5px solid var(--secondary);
      border-radius: 18px; padding: 14px; margin: 0 auto 18px;
      max-width: 240px;
    }
    .qr-frame img { display: block; width: 100%; height: auto; border-radius: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 28px; border-radius: var(--radius-full); text-decoration: none; font-size: 15px; font-weight: 700; transition: transform .15s ease; border: none; cursor: pointer; font-family: inherit; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 10px 28px rgba(199,58,106,0.28); }
    .btn-secondary { background: var(--secondary); color: var(--text); }

    .tips-card {
      background: var(--surface); border-radius: var(--radius-lg);
      padding: 18px 20px; margin-top: 18px;
      border: 1px dashed rgba(199,58,106,0.35);
    }
    .tips-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .tips-list { list-style: none; font-size: 13.5px; color: var(--muted); line-height: 1.8; }
    .tips-list li::before { content: "💡 "; }

    .footer-cta { position: fixed; bottom: 0; left: 0; right: 0; padding: 14px 22px 22px; background: linear-gradient(transparent, var(--bg) 50%); display: flex; gap: 12px; justify-content: center; z-index: 10; }
    .footer-cta .btn { flex: 1; max-width: 260px; }
    .spacer { height: 90px; }
    .toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.96);
      background: rgba(0,0,0,0.78); color: #fff; padding: 14px 26px; border-radius: 14px;
      font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 100;
    }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  </style>
